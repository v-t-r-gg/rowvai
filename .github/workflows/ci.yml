name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p rowva-mcp --test stdio_smoke
      - run: cargo test -p rowva-eval
      - run: cargo test -p rowva-store-sqlite immutable_dataset_analysis_and_terminal_invalidation_are_durable
      - run: cargo run -p rowva-eval -- fixture run fixtures/shadow/deal_stage_cases.json --json
      - run: cargo run -p rowva-eval -- fixture quality-run fixtures/quality/deal_stage_quality_cases.json --json
      - run: npm ci
      - run: npm run build
