[package]
name = "rowva"
version = "0.1.0"
edition = "2021"
description = "RowvAI — Local-first relational spreadsheet CRM"
license = "Apache-2.0"

[lib]
name = "rowva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
rowva-core = { path = "../crates/rowva-core" }
rowva-store-sqlite = { path = "../crates/rowva-store-sqlite" }
serde.workspace = true
serde_json.workspace = true
